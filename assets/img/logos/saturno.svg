<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Saturno">
  <defs>
    <!-- El disco del planeta recorta sus bandas -->
    <clipPath id="planeta">
      <circle cx="32" cy="32" r="17"/>
    </clipPath>

    <!-- Mitades para que el anillo pase por detras arriba y por delante abajo -->
    <clipPath id="mitadTrasera" clipPathUnits="userSpaceOnUse">
      <rect x="-20" y="-20" width="104" height="52"/>
    </clipPath>
    <clipPath id="mitadDelantera" clipPathUnits="userSpaceOnUse">
      <rect x="-20" y="32" width="104" height="52"/>
    </clipPath>

    <!-- Anillo: mas claro a la izquierda, en sombra a la derecha -->
    <linearGradient id="colorAnillo" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#d9bd80"/>
      <stop offset="45%"  stop-color="#b08f55"/>
      <stop offset="100%" stop-color="#7d6338"/>
    </linearGradient>

    <!-- Volumen del planeta: luz arriba-izquierda, sombra abajo-derecha -->
    <radialGradient id="volumen" cx="36%" cy="30%" r="76%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2a10" stop-opacity="0.60"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-25 32 32)">

    <!-- 1. Mitad del anillo que pasa POR DETRAS del planeta -->
    <g clip-path="url(#mitadTrasera)">
      <path fill-rule="evenodd" fill="url(#colorAnillo)"
            d="M2,32 a30,9.6 0 1,0 60,0 a30,9.6 0 1,0 -60,0
               M9,32 a23,7.2 0 1,0 46,0 a23,7.2 0 1,0 -46,0"/>
    </g>

    <!-- 2. El planeta -->
    <circle cx="32" cy="32" r="17" fill="#f4dfab"/>
    <g clip-path="url(#planeta)">
      <!-- Bandas suaves: Saturno contrasta menos que Jupiter -->
      <rect x="10" y="15" width="44" height="6" fill="#cfa863" opacity="0.75"/>
      <rect x="10" y="24" width="44" height="5" fill="#f4e4bb" opacity="0.8"/>
      <rect x="10" y="33" width="44" height="6" fill="#d3ad68" opacity="0.7"/>
      <rect x="10" y="41" width="44" height="5" fill="#f2e0b4" opacity="0.6"/>
      <rect x="10" y="10" width="44" height="64" fill="url(#volumen)"/>
    </g>

    <!-- 3. Mitad del anillo que pasa POR DELANTE del planeta -->
    <g clip-path="url(#mitadDelantera)">
      <path fill-rule="evenodd" fill="url(#colorAnillo)"
            d="M2,32 a30,9.6 0 1,0 60,0 a30,9.6 0 1,0 -60,0
               M9,32 a23,7.2 0 1,0 46,0 a23,7.2 0 1,0 -46,0"/>
      <!-- Sombra que el planeta proyecta sobre el anillo -->
      <ellipse cx="39" cy="38" rx="10" ry="4" fill="#4a3617" opacity="0.16"/>
    </g>

    <!-- Borde sutil: despega el planeta de fondos claros y oscuros -->
    <circle cx="32" cy="32" r="17" fill="none" stroke="#4a3617" stroke-opacity="0.45" stroke-width="1.3"/>
  </g>
</svg>
